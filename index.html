<script>
'use strict';
// =====================================================
// PDF.JS WORKER
// =====================================================
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

// =====================================================
// SUPABASE CLIENT
// =====================================================
let SB = null;
const CFG_KEY = 'ss_config';

function loadConfig(){
  try{ return JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }
  catch(e){ return null; }
}
function saveConfig(cfg){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

function initSupabase(url, key){
  if(!url||!key) return false;
  try{
    SB = window.supabase.createClient(url, key, {
      auth:{ persistSession:true, autoRefreshToken:true }
    });
    return true;
  }catch(e){ console.error('Supabase init error:',e); return false; }
}

// =====================================================
// APP STATE
// =====================================================
const S = {
  user:null, profile:null, page:'login', params:{},
  docs:[], notifs:[], unreadCount:0,
  syStep:1, syFile:null, syName:'', syFields:[], syDocId:null, syPdf:null, syPages:0, syPlacing:null, syFilePath:null,
  stoStep:1, stoFile:null, stoName:'', stoRecs:[], stoFields:[], stoDocId:null, stoPdf:null, stoPages:0, stoPlacing:null, stoActiveRec:0, stoFilePath:null, stoOrder:'sequential', stoSubj:'', stoMsg:'', stoDeadline:'',
  auditDocId:null, adminTab:'users', settingsTab:'profile', docFilter:'all', docSearch:'',
  notifOpen:false,
  allUsers:[], allDelegations:[],
  faceModelsLoaded:false, faceStream:null,
  extToken:null, extDoc:null, extRecipient:null,
};
const PDF_CACHE = {};
const REC_COLORS = ['#2563EB','#7C3AED','#059669','#D97706','#DB2777','#0891B2'];

// =====================================================
// UTILITIES
// =====================================================
const genId = ()=>Math.random().toString(36).substr(2,9);
const fmtDate = iso=>iso?new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'-';
const fmtDT   = iso=>iso?new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const timeAgo = iso=>{const d=Date.now()-new Date(iso).getTime(),m=Math.floor(d/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';};
const initials = n=>n?n.trim().split(' ').map(w=>w[0]).join('').toUpperCase().substr(0,2):'?';
const AVC = ['#2563EB','#7C3AED','#059669','#D97706','#0891B2','#DB2777'];
const avColor = s=>AVC[(s||'').charCodeAt(0)%AVC.length];
const esc = s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const deadlineUrgency = iso=>{if(!iso)return{cls:'',txt:''};const d=new Date(iso)-Date.now();const h=d/3600000;if(d<0)return{cls:'urgency-red',txt:'Overdue'};if(h<24)return{cls:'urgency-red',txt:'Due today'};if(h<72)return{cls:'urgency-amber',txt:`Due in ${Math.ceil(h/24)}d`};return{cls:'urgency-green',txt:`Due ${fmtDate(iso)}`};};

function toast(msg,type='info'){
  const tc=document.getElementById('toast-ct');
  const el=document.createElement('div');
  const ic={ok:'✓',err:'✕',info:'ℹ',success:'✓'};
  const cs={ok:'var(--ok)',err:'var(--err)',info:'var(--blue)',success:'var(--ok)'};
  const key=type==='success'?'ok':type;

}

async function dbQuery(table, options={}){
  if(!SB) throw new Error('Not connected to Supabase');
  let q = SB.from(table).select(options.select||'*');
  if(options.filter) for(const[k,v] of Object.entries(options.filter)) q=q.eq(k,v);
  if(options.order) q=q.order(options.order, {ascending:options.asc??false});
  if(options.limit) q=q.limit(options.limit);
  const{data,error}=await q;
  if(error) throw error;
  return data;
}

const FACE_MODELS_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';
let faceDetectInterval = null;

async function loadFaceModels(){
  if(S.faceModelsLoaded) return true;
  if(!window.faceapi){ toast('Face API library not loaded','err'); return false; }
  try{
    showLoading('Loading face detection models…');
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS_URL),
      faceapi.nets.faceExpressionNet.loadFromUri(FACE_MODELS_URL),
    ]);
    S.faceModelsLoaded = true;
    hideLoading();
    return true;
  }catch(e){
    hideLoading();
    toast('Face models failed to load: '+e.message,'err');
    console.error('Face model load error:',e);
    return false;
  }
}

async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{width:480,height:360,facingMode:'user'},audio:false});
    S.faceStream = stream;
    return stream;
  }catch(e){
    toast('Camera access denied: '+e.message,'err');
    return null;
  }
}

function stopCamera(){
  if(S.faceStream){ S.faceStream.getTracks().forEach(t=>t.stop()); S.faceStream=null; }
  if(faceDetectInterval){ clearInterval(faceDetectInterval); faceDetectInterval=null; }
}

function showFaceVerificationModal(recipientId, onPass){
  showModal(`<div class="modal modal-md">
    <div class="modal-hd"><span class="modal-title">${IC.face} Identity Verification</span></div>
    <div class="modal-bd">
      <p class="text-sm text-mut mb4">Look directly at the camera. Keep your face within the frame. This verifies your identity before signing.</p>
      <div class="face-overlay" style="width:100%;text-align:center">
        <video id="face-video" width="440" height="330" autoplay muted playsinline style="border-radius:8px;background:#1E293B;display:block;margin:0 auto"></video>
        <canvas id="face-canvas" width="440" height="330" style="position:absolute;top:0;left:50%;transform:translateX(-50%)"></canvas>
      </div>
      <div id="face-status" style="margin-top:12px;text-align:center">
        <div class="spinner" style="margin:0 auto 8px"></div>
        <div class="text-sm text-mut" id="face-msg">Starting camera…</div>
      </div>
      <div style="margin-top:10px">
        <div class="liveness-bar"><div class="liveness-fill" id="liveness-fill" style="width:0%"></div></div>
        <div class="text-sm text-mut mt2 text-center" id="liveness-txt">Detecting face…</div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-secondary" id="face-skip">Skip Verification</button>
      <button class="btn btn-primary hidden" id="face-pass">Continue →</button>
    </div>
  </div>`);

  (async()=>{
    const modelsOk = await loadFaceModels();
    if(!modelsOk){ document.getElementById('face-msg').textContent='Face models unavailable — skip to continue'; return; }
    const stream = await startCamera();
    if(!stream){ document.getElementById('face-msg').textContent='Camera unavailable — skip to continue'; return; }
    const video = document.getElementById('face-video');
    if(!video){ stopCamera(); return; }
    video.srcObject = stream;
    await new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true}));
    video.play();

    const canvas = document.getElementById('face-canvas');
    const ctx = canvas.getContext('2d');
    let faceFrames=0, confidence=0;

    faceDetectInterval = setInterval(async()=>{
      const video2=document.getElementById('face-video');
      if(!video2){ clearInterval(faceDetectInterval); return; }
      try{
        const detection = await faceapi
          .detectSingleFace(video2, new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5}))
          .withFaceLandmarks().withFaceExpressions();

        ctx.clearRect(0,0,canvas.width,canvas.height);
        if(detection){
          const{x,y,width,height}=detection.detection.box;
          const scaleX=canvas.width/video2.videoWidth, scaleY=canvas.height/video2.videoHeight;
          ctx.strokeStyle='#059669'; ctx.lineWidth=2; ctx.strokeRect(x*scaleX,y*scaleY,width*scaleX,height*scaleY);
          ctx.fillStyle='rgba(5,150,105,.1)'; ctx.fillRect(x*scaleX,y*scaleY,width*scaleX,height*scaleY);
          faceFrames++;
          confidence = Math.min(100, faceFrames*4);
          const lf=document.getElementById('liveness-fill');
          const lt=document.getElementById('liveness-txt');
          const fm=document.getElementById('face-msg');
          if(lf) lf.style.width=confidence+'%';
          if(fm) fm.textContent=`Face detected — hold still (${confidence}%)`;
          if(lt) lt.textContent=confidence>=100?'✓ Liveness verified!':confidence>=50?'Looks good, keep going…':'Detecting…';
          if(confidence>=100){
            clearInterval(faceDetectInterval);
            ctx.strokeStyle='#059669'; ctx.lineWidth=3; ctx.strokeRect(x*scaleX,y*scaleY,width*scaleX,height*scaleY);
            const fp=document.getElementById('face-pass');
            if(fp) fp.classList.remove('hidden');
            if(fm) fm.textContent='✅ Identity verified!';
            // Auto-proceed after 1.5s
            setTimeout(()=>{
              stopCamera(); hideModal();
              onPass({passed:true, confidence:detection.detection.score, expressions:detection.expressions});
            },1500);
          }
        }else{
          faceFrames=Math.max(0,faceFrames-1);
          confidence=Math.max(0,confidence-2);
          const lf=document.getElementById('liveness-fill');
          if(lf) lf.style.width=Math.max(0,confidence)+'%';
          const fm=document.getElementById('face-msg');
          if(fm) fm.textContent='No face detected — look at the camera';
        }
      }catch(e){ console.warn('Detection frame error:',e); }
    },300);

    const skipBtn=document.getElementById('face-skip');
    if(skipBtn) skipBtn.onclick=()=>{ stopCamera(); hideModal(); onPass({passed:false,confidence:0,skipped:true}); };
    const passBtn=document.getElementById('face-pass');
    if(passBtn) passBtn.onclick=()=>{ stopCamera(); hideModal(); onPass({passed:true,confidence:1,manual:true}); };
  })();
}

function nav(page, params={}){
  if(page!=='sign-yourself'&&page!=='send-to-others'){
    S.syStep=1;S.syFile=null;S.syName='';S.syFields=[];S.syDocId=null;S.syPdf=null;S.syPlacing=null;

  }
  S.page=page; S.params=params; S.notifOpen=false;
  render();
}

async function render(){
  const app=document.getElementById('app');
  const cfg=loadConfig();
  if(!cfg?.supabaseUrl||!cfg?.supabaseKey){ app.innerHTML=renderSetup(); bindSetupEvents(); return; }
  if(!SB){ initSupabase(cfg.supabaseUrl,cfg.supabaseKey); }

  // Check external signing token first
  const urlToken=new URLSearchParams(window.location.search).get('token');
  if(urlToken && !S.user){ await loadExternalSigning(urlToken); return; }

  if(!S.user){ app.innerHTML=renderLogin(); bindLoginEvents(); return; }
  app.innerHTML=renderShell(await getPageContent());
  bindAppEvents();
  subscribeNotifications();
}

// EXTERNAL SIGNING (token-based, no login needed)
// =====================================================
async function loadExternalSigning(token){
  const app=document.getElementById('app');
  app.innerHTML=`<div style="min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>`;
  try{
    // Fetch recipient by token (anon access via RLS policy)
    const{data:rec,error:re}=await SB.from('signing_recipients').select('*').eq('signing_token',token).single();
    if(re||!rec) throw new Error('Invalid or expired signing link');
    if(rec.status==='signed') throw new Error('You have already signed this document');
    const{data:doc,error:de}=await SB.from('documents').select('*').eq('id',rec.document_id).single();
    if(de||!doc) throw new Error('Document not found');
    S.extToken=token; S.extDoc=doc; S.extRecipient=rec;
    app.innerHTML=renderExternalSigning(doc,rec);
    bindExternalSigningEvents(doc,rec);
  }catch(e){
    app.innerHTML=`<div style="min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center">
    <div class="login-card" style="text-align:center"><div style="font-size:48px;margin-bottom:16px">❌</div>
    <h2 class="fw7 mb3">${esc(e.message)}</h2>
    <p class="text-mut text-sm">Contact the document sender if you believe this is an error.</p></div></div>`;
  }
}

function renderExternalSigning(doc, rec){
  return`<div style="min-height:100vh;background:var(--bg)">
  <div style="background:var(--navy);padding:16px 24px;display:flex;align-items:center;gap:12px">

function bindExternalSigningEvents(doc, rec){
  let ocrPassed = rec.verify_method!=='otp_ocr';
  let otpAttempts = rec.otp_attempts||0;

  const startOcr=document.getElementById('ext-start-ocr');
  if(startOcr) startOcr.onclick=()=>{
    showFaceVerificationModal(rec.id, async(result)=>{
      ocrPassed=result.passed||result.skipped;
      await SB.from('signing_recipients').update({ocr_passed:result.passed,ocr_confidence:result.confidence}).eq('id',rec.id);
      await logAudit(doc.id,`OCR verification ${result.passed?'passed':'skipped'} by ${rec.name}`,{confidence:result.confidence});
      document.getElementById('ext-otp-section').style.display='block';
      document.getElementById('ext-start-ocr').closest('div').style.display='none';
      // Send OTP
      await generateAndSendOTP(rec.id, rec.name, rec.email, doc.name);
    });
  };

  // Auto-send OTP if method is just 'otp'
  if(rec.verify_method==='otp') generateAndSendOTP(rec.id, rec.name, rec.email, doc.name);

  const resendOtp=document.getElementById('ext-resend-otp');
  if(resendOtp) resendOtp.onclick=()=>generateAndSendOTP(rec.id, rec.name, rec.email, doc.name);

  const verifyOtp=document.getElementById('ext-verify-otp');
  if(verifyOtp) verifyOtp.onclick=async()=>{
    const entered=(document.getElementById('ext-otp-input').value||'').trim();
    const errEl=document.getElementById('ext-otp-err');
    // Fetch fresh OTP from DB
    const{data:freshRec}=await SB.from('signing_recipients').select('otp_code,otp_expires_at,otp_attempts').eq('id',rec.id).single();
    if(!freshRec){ errEl.textContent='Error fetching OTP data'; errEl.classList.remove('hidden'); return; }
    if(new Date(freshRec.otp_expires_at)<new Date()){ errEl.textContent='OTP expired. Click Resend.'; errEl.classList.remove('hidden'); return; }
    if(entered!==freshRec.otp_code){
      otpAttempts++;
      await SB.from('signing_recipients').update({otp_attempts:otpAttempts}).eq('id',rec.id);
      await logAudit(doc.id,`OTP verification failed by ${rec.name} (attempt ${otpAttempts})`);
      if(otpAttempts>=3){ errEl.textContent='Too many attempts. Session locked. Contact the sender.'; errEl.classList.remove('hidden'); document.getElementById('ext-verify-otp').disabled=true; return; }
      document.getElementById('ext-attempts').textContent=3-otpAttempts;
      errEl.textContent='Incorrect code. Try again.'; errEl.classList.remove('hidden'); return;
    }
    errEl.classList.add('hidden');
    await SB.from('signing_recipients').update({status:'viewed',otp_attempts:otpAttempts}).eq('id',rec.id);
    await logAudit(doc.id,`OTP verified by ${rec.name}`);
    // Update rec view + audit
    await SB.from('audit_log').insert({document_id:doc.id,action:`Document viewed by ${rec.name}`,actor_name:rec.name,ip_address:'external',device:navigator.userAgent.substr(0,100)});
    // Show signing area
    document.getElementById('ext-verify-section').style.display='none';
    document.getElementById('ext-signing-area').classList.remove('hidden');
    await loadExternalDocumentCanvas(doc, rec);
  };

  const proceedBtn=document.getElementById('ext-proceed');
  if(proceedBtn) proceedBtn.onclick=async()=>{
    document.getElementById('ext-proceed').style.display='none';
    document.getElementById('ext-signing-area').classList.remove('hidden');
    await loadExternalDocumentCanvas(doc, rec);
  };
}

async function generateAndSendOTP(recipientId, name, email, docName){
  const otp=Math.floor(100000+Math.random()*900000).toString();
  const expires=new Date(Date.now()+600000).toISOString(); // 10 min
  await SB.from('signing_recipients').update({otp_code:otp, otp_expires_at:expires, otp_attempts:0}).eq('id',recipientId);
  const result=await sendOTPEmail(recipientId, name, email, otp, docName);
  if(result?.success) toast(`OTP sent to ${email}`,'success');
  else toast(`Email not configured — OTP: ${otp}`,'info'); // Show on screen if no email
}

async function loadExternalDocumentCanvas(doc, rec){
  const container=document.getElementById('ext-doc-pages');
  if(!container) return;
  container.innerHTML=`<div style="color:#fff;font-size:13px">Loading document…</div>`;
  let fields=[];
  try{ fields=typeof doc.signing_fields==='string'?JSON.parse(doc.signing_fields):doc.signing_fields||[]; }catch(e){ fields=[]; }
  const myFields=fields.filter(f=>f.recipientId===rec.id||f.recipientIdx===rec.recipient_idx);

  if(!PDF_CACHE['ext']&&doc.file_path){
    try{
      const{data:{signedUrl}}=await SB.storage.from('documents').createSignedUrl(doc.file_path,3600);
      const resp=await fetch(signedUrl);
      PDF_CACHE['ext']=await resp.arrayBuffer();
    }catch(e){ container.innerHTML=`<div style="color:#fff;padding:20px">Could not load document file.</div>`; return; }
  }
  if(!PDF_CACHE['ext']){ container.innerHTML=`<div style="color:#fff;padding:20px">No document file found.</div>`; return; }

  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(PDF_CACHE['ext'])}).promise;
  container.innerHTML='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:1.2});
    const wrap=document.createElement('div');
    wrap.id=`ext-pw-${p}`;
    wrap.style.cssText=`position:relative;width:${vp.width}px;height:${vp.height}px;box-shadow:0 4px 20px rgba(0,0,0,.3);`;
    const canvas=document.createElement('canvas');
    canvas.width=vp.width; canvas.height=vp.height; canvas.style.display='block';
    wrap.appendChild(canvas);
    container.appendChild(wrap);
    const ctx=canvas.getContext('2d');
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    // Add my fields for this page
    myFields.filter(f=>f.page===p).forEach(f=>{
      const el=document.createElement('div');
      el.id=`extf-${f.id}`;
      el.style.cssText=`position:absolute;left:${f.x*(1.2/1.5)}px;top:${f.y*(1.2/1.5)}px;width:${f.w*(1.2/1.5)}px;height:${f.h*(1.2/1.5)}px;border:2px dashed #2563EB;background:rgba(37,99,235,.1);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#2563EB;font-family:Inter,sans-serif;`;
      const labels={signature:'✍ Sign here',initials:'Initials',date:'📅 Date',text:'Text',name:'Name'};
      el.textContent=labels[f.type]||f.type;
      el.addEventListener('click',()=>openExtFillModal(f,el,myFields,rec));
      wrap.appendChild(el);
    });
  }

  // Complete + Decline buttons
  const completeBtn=document.getElementById('ext-complete');
  const declineBtn=document.getElementById('ext-decline');
  if(completeBtn) completeBtn.onclick=()=>completeExternalSigning(doc,rec,myFields,pdf);
  if(declineBtn) declineBtn.onclick=()=>showDeclineModal(doc,rec);
}

function openExtFillModal(field, el, allFields, rec){
  const isDrawable=field.type==='signature'||field.type==='initials';
  showModal(`<div class="modal modal-md">
    <div class="modal-hd"><span class="modal-title">${field.type==='signature'?'Sign Here':field.type==='initials'?'Add Initials':field.type==='date'?'Set Date':field.type==='name'?'Your Name':'Enter Text'}</span>
    <button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
    ${isDrawable?`<div class="tabs" id="ext-fill-tabs"><div class="tab active" data-etab="draw">Draw</div><div class="tab" data-etab="type">Type</div></div>
      <div id="etab-draw"><canvas id="draw-canvas" width="500" height="150" style="touch-action:none"></canvas>
        <button class="btn btn-ghost btn-sm mt2" id="ext-clear">Clear</button></div>
      <div id="etab-type" class="hidden"><div class="fg"><label class="fl">Type your ${field.type}</label>
        <input class="fi" id="ext-type-txt" placeholder="${rec.name}" style="font-family:'Dancing Script',cursive;font-size:26px;height:64px"></div></div>`:''}
    ${field.type==='date'?`<div class="fg"><label class="fl">Date</label><input type="date" class="fi" id="ext-date-val" value="${new Date().toISOString().slice(0,10)}"></div>`:''}
    ${field.type==='text'||field.type==='name'?`<div class="fg"><label class="fl">${field.type==='name'?'Full Name':'Text'}</label><input class="fi" id="ext-text-val" placeholder="${field.type==='name'?rec.name:'Enter text…'}" value="${field.type==='name'?rec.name:''}"></div>`:''}
    </div>
    <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="ext-fill-confirm">Apply</button></div>
  </div>`);

  if(isDrawable){
    const canvas=document.getElementById('draw-canvas');
    const ctx=canvas.getContext('2d');
    ctx.strokeStyle='#0F172A'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round';
    let drawing=false,lx,ly;
    const pos=e=>{const r=canvas.getBoundingClientRect();return[(e.touches?e.touches[0].clientX:e.clientX-r.left)*(canvas.width/r.width),(e.touches?e.touches[0].clientY:e.clientY-r.top)*(canvas.height/r.height)];};
    canvas.addEventListener('mousedown',e=>{drawing=true;[lx,ly]=pos(e);});
    canvas.addEventListener('mousemove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];});
    canvas.addEventListener('mouseup',()=>drawing=false); canvas.addEventListener('mouseleave',()=>drawing=false);
    canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;[lx,ly]=pos(e);},{passive:false});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];},{passive:false});
    canvas.addEventListener('touchend',()=>drawing=false);
    document.getElementById('ext-clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
    let activeTab='draw';
    document.querySelectorAll('#ext-fill-tabs .tab').forEach(t=>t.addEventListener('click',()=>{
      document.querySelectorAll('#ext-fill-tabs .tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
      activeTab=t.dataset.etab;
      document.getElementById('etab-draw').classList.toggle('hidden',activeTab!=='draw');
      document.getElementById('etab-type').classList.toggle('hidden',activeTab!=='type');
    }));
    document.getElementById('ext-fill-confirm').onclick=()=>{
      let val;
      if(activeTab==='draw'){
        const id=ctx.getImageData(0,0,canvas.width,canvas.height);
        if(!id.data.some((v,i)=>i%4===3&&v>10)){toast('Please draw first','err');return;}
        val=canvas.toDataURL();
      }else{
        val=(document.getElementById('ext-type-txt').value||'').trim();
        if(!val){toast('Enter text','err');return;}
        const oc=document.createElement('canvas');oc.width=field.w*2;oc.height=field.h*2;
        const oc2=oc.getContext('2d');oc2.font=`${field.h*1.1}px "Dancing Script",cursive`;oc2.fillStyle='#0F172A';oc2.textBaseline='middle';
        oc2.fillText(val,4,field.h); val=oc.toDataURL();
      }
      field.value=val; el.style.borderStyle='solid'; el.style.borderColor='#059669'; el.style.background='rgba(5,150,105,.1)';
      el.innerHTML=`<img src="${val}" style="max-width:100%;max-height:100%;object-fit:contain">`;
      hideModal();
    };
  }else if(field.type==='date'){
    document.getElementById('ext-fill-confirm').onclick=()=>{
      const v=document.getElementById('ext-date-val').value;
      if(!v){toast('Pick a date','err');return;}
      field.value=new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      el.textContent=field.value; el.style.borderStyle='solid'; el.style.borderColor='#059669'; hideModal();
    };
  }else{
    document.getElementById('ext-fill-confirm').onclick=()=>{
      const v=(document.getElementById('ext-text-val').value||'').trim();
      if(!v){toast('Enter text','err');return;}
      field.value=v; el.textContent=v; el.style.borderStyle='solid'; el.style.borderColor='#059669'; hideModal();
    };
  }
}

async function completeExternalSigning(doc, rec, myFields, pdf){
  const required=myFields.filter(f=>f.required!==false);
  const unfilled=required.filter(f=>!f.value);
  if(unfilled.length>0){ toast(`Please fill all required fields (${unfilled.length} remaining)`,'err'); return; }
  showLoading('Completing signing…');
  try{
    // Update fields in document
    let allFields=[];
    try{ allFields=typeof doc.signing_fields==='string'?JSON.parse(doc.signing_fields):doc.signing_fields||[]; }catch(e){ allFields=[]; }
    myFields.forEach(f=>{ const idx=allFields.findIndex(x=>x.id===f.id); if(idx>=0) allFields[idx]=f; });
    await SB.from('documents').update({signing_fields:JSON.stringify(allFields)}).eq('id',doc.id);
    await SB.from('signing_recipients').update({status:'signed',signed_at:new Date().toISOString()}).eq('id',rec.id);
    await logAudit(doc.id,`Signed by ${rec.name}`,{recipientId:rec.id});
    // Check if all signed
    const{data:allRecs}=await SB.from('signing_recipients').select('status,role').eq('document_id',doc.id);
    const signers=allRecs.filter(r=>r.role==='signer');
    const allSigned=signers.every(r=>r.status==='signed');
    if(allSigned){
      await SB.from('documents').update({status:'completed'}).eq('id',doc.id);
      await logAudit(doc.id,'All parties signed — document completed');
      const{data:uploader}=await SB.from('profiles').select('name,email').eq('id',doc.uploaded_by).single();
      if(uploader) await sendCompletionEmail(uploader.email,uploader.name,doc.name,signers.length);
    }
    hideLoading();
    document.getElementById('ext-content').innerHTML=`<div class="card"><div class="card-bd" style="text-align:center;padding:40px">
      <div style="font-size:48px;margin-bottom:16px">✅</div><h2 class="fw7 mb3">Successfully Signed!</h2>
      <p class="text-mut mb4">You have signed <b>${esc(doc.name)}</b>. A copy will be emailed once all parties sign.</p>
      <div style="padding:14px;background:var(--ok-l);border-radius:8px;font-size:13px;color:#065F46">
        ${allSigned?'🎉 All parties have signed — the document is now complete!':'⏳ Waiting for other signers…'}</div></div></div>`;
  }catch(e){ hideLoading(); toast('Error completing signing: '+e.message,'err'); }
}

let notifChannel=null;
async function subscribeNotifications(){
  if(!SB||!S.user||notifChannel) return;
  // Load initial unread count
  const{data,count}=await SB.from('notifications').select('id',{count:'exact'}).eq('user_id',S.user.id).eq('read',false);
  S.unreadCount=count||0;
  updateNotifBell();

  notifChannel=SB.channel('user-notifs-'+S.user.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:`user_id=eq.${S.user.id}`},
      payload=>{
        S.unreadCount++;
        updateNotifBell();
        toast(payload.new.title, payload.new.type||'info');
      })
    .subscribe();
}
function updateNotifBell(){
  const badge=document.getElementById('notif-badge');
  if(badge){ badge.textContent=S.unreadCount; badge.style.display=S.unreadCount>0?'flex':'none'; }
}

function bindSetupEvents(){
  document.getElementById('dl-schema').onclick=(e)=>{
    e.preventDefault();
    const schema=`-- Download from the GitHub repo or contact your developer for schema.sql\n-- Run in Supabase SQL Editor`;
    const blob=new Blob([schema],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='schema.sql';a.click();
  };
  document.getElementById('dl-func').onclick=(e)=>{
    e.preventDefault();
    const code=`// Deploy this as a Supabase Edge Function named "send-email"\n// See send-email.ts in the download package`;
    const blob=new Blob([code],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='send-email.ts';a.click();
  };
  document.getElementById('setup-connect').onclick=async()=>{
    const url=(document.getElementById('setup-url').value||'').trim();
    const key=(document.getElementById('setup-key').value||'').trim();
    const resend=(document.getElementById('setup-resend').value||'').trim();
    if(!url||!key){document.getElementById('setup-err').textContent='Supabase URL and Anon Key are required.';document.getElementById('setup-err').classList.remove('hidden');return;}
    if(!url.startsWith('https://')){document.getElementById('setup-err').textContent='URL must start with https://';document.getElementById('setup-err').classList.remove('hidden');return;}
    const ok=initSupabase(url,key);
    if(!ok){document.getElementById('setup-err').textContent='Failed to initialize Supabase client. Check your URL and key.';document.getElementById('setup-err').classList.remove('hidden');return;}
    showLoading('Testing connection…');
    try{
      const{error}=await SB.from('profiles').select('id').limit(1);
      if(error&&error.code!=='PGRST116') throw error;
      saveConfig({supabaseUrl:url,supabaseKey:key,resendKey:resend||null});
      hideLoading(); toast('Connected to Supabase!','success');
      setTimeout(()=>render(),500);
    }catch(e){
      hideLoading();
      document.getElementById('setup-err').textContent='Connection failed: '+(e.message||'Check your credentials and try again.');
      document.getElementById('setup-err').classList.remove('hidden');
    }
  };
}

function bindLoginEvents(){
  document.getElementById('l-btn').onclick=doLogin;
  document.getElementById('l-email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('l-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

    document.getElementById('signup-form').classList.remove('hidden');
  };

    document.getElementById('login-form').classList.remove('hidden');
  };

async function doLogin(){
  const email=(document.getElementById('l-email').value||'').trim();
  const pw=(document.getElementById('l-pw').value||'');
  if(!email||!pw){showLoginErr('Please enter email and password.');return;}
  showLoading('Signing in…');
  try{
    const{data,error}=await SB.auth.signInWithPassword({email,password:pw});
    if(error) throw error;
    if(data.session?.user?.factors?.length>0){
      // MFA required
      hideLoading();
      S.mfaFactorId=data.session.user.factors[0].id;
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('mfa-form').classList.remove('hidden');
      document.getElementById('l-mfa-btn').onclick=doMFA;
      document.getElementById('l-back-mfa').onclick=()=>{document.getElementById('mfa-form').classList.add('hidden');document.getElementById('login-form').classList.remove('hidden');};
      return;
    }
    S.user=data.user;
    await loadProfile();
    hideLoading(); toast(`Welcome back, ${S.profile?.name?.split(' ')[0]||'there'}!`,'success');
    nav('home');
  }catch(e){
    hideLoading(); showLoginErr(e.message||'Login failed');
  }
}

async function doSignup(){
  const name=(document.getElementById('s-name').value||'').trim();
  const email=(document.getElementById('s-email').value||'').trim();
  const pw=(document.getElementById('s-pw').value||'');
  const dept=(document.getElementById('s-dept').value||'').trim();
  if(!name||!email||!pw){showSignupErr('All fields required.');return;}
  if(pw.length<6){showSignupErr('Password must be at least 6 characters.');return;}
  showLoading('Creating account…');
  try{
    const{data,error}=await SB.auth.signUp({email,password:pw,options:{data:{name,dept,role:'user'}}});
    if(error) throw error;
    S.user=data.user;
    // Profile created by DB trigger; load it
    await new Promise(r=>setTimeout(r,800)); // Wait for trigger
    await loadProfile();
    hideLoading(); toast('Account created! Welcome to SignSoft.','success');
    nav('home');
  }catch(e){
    hideLoading(); showSignupErr(e.message||'Sign up failed');
  }
}

async function doMFA(){
  const code=(document.getElementById('l-totp').value||'').trim();
  if(!code){return;}
  showLoading('Verifying…');
  try{
    const{data:{session},error}=await SB.auth.mfa.challengeAndVerify({factorId:S.mfaFactorId,code});
    if(error) throw error;
    S.user=session.user;
    await loadProfile();
    hideLoading(); toast(`Welcome back, ${S.profile?.name?.split(' ')[0]||'there'}!`,'success');
    nav('home');
  }catch(e){
    hideLoading();
    document.getElementById('mfa-err').textContent=e.message||'Incorrect code';
    document.getElementById('mfa-err').classList.remove('hidden');
  }
}

function showLoginErr(msg){document.getElementById('l-err').textContent=msg;document.getElementById('l-err').classList.remove('hidden');}
function showSignupErr(msg){document.getElementById('s-err').textContent=msg;document.getElementById('s-err').classList.remove('hidden');}

async function loadProfile(){
  if(!S.user) return;
  const{data,error}=await SB.from('profiles').select('*').eq('id',S.user.id).single();
  if(!error) S.profile=data;
  else{
    // Profile might not exist yet (new user), create it
    const{error:ie}=await SB.from('profiles').insert({
      id:S.user.id, name:S.user.user_metadata?.name||S.user.email?.split('@')[0]||'User',
      email:S.user.email, role:S.user.user_metadata?.role||'user',
      dept:S.user.user_metadata?.dept||null
    });
    if(!ie){ const{data:d2}=await SB.from('profiles').select('*').eq('id',S.user.id).single(); S.profile=d2; }
  }
}

}

function showAddDelegateModal(){
  SB.from('profiles').select('id,name,email').neq('id',S.user.id).eq('status','active').then(({data:users=[]})=>{
    showModal(`<div class="modal modal-sm">
    <div class="modal-hd"><span class="modal-title">Add Delegate</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
      <div class="fg"><label class="fl">Delegate (user who signs on your behalf)</label>
        <select class="fi" id="del-user">${users.map(u=>`<option value="${u.id}">${esc(u.name)} — ${esc(u.email)}</option>`).join('')}</select></div>
      <div class="grid2"><div class="fg"><label class="fl">Start Date</label><input type="date" class="fi" id="del-start" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="fg"><label class="fl">End Date</label><input type="date" class="fi" id="del-end"></div></div>
      <div class="fg"><label class="fl">Restrict to document type (optional)</label><input class="fi" id="del-type" placeholder="e.g. HR, Legal, Contracts"></div>
      <label class="flex gap2 aic" style="cursor:pointer"><input type="checkbox" id="del-approve"> Require delegate's approval before activating</label>
    </div>
    <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="del-save">Create Delegation</button></div>
  </div>`);
    document.getElementById('del-save').onclick=async()=>{
      const uid=document.getElementById('del-user').value;
      const start=document.getElementById('del-start').value;
      const end=document.getElementById('del-end').value;
      const type=document.getElementById('del-type').value.trim();
      const needsApproval=document.getElementById('del-approve').checked;
      if(!start||!end){toast('Set start and end dates','err');return;}
      if(new Date(end)<=new Date(start)){toast('End date must be after start','err');return;}
      const{error}=await SB.from('delegations').insert({delegator_id:S.user.id,delegate_id:uid,start_date:new Date(start).toISOString(),end_date:new Date(end).toISOString(),doc_type_restriction:type||null,requires_approval:needsApproval,status:needsApproval?'pending_approval':'active'});
      if(error){toast('Error: '+error.message,'err');return;}
      await logAudit(null,'Delegation created',{delegateId:uid});
      hideModal(); toast('Delegation created!','success'); nav('delegate');
    };
  });
}

// =====================================================
// PDF RENDERING
// =====================================================
async function renderPDFPages(arrayBuffer, mode){
  const pagesEl=document.getElementById(`${mode}-pages`);
  if(!pagesEl) return;
  pagesEl.innerHTML='<div style="color:#fff;font-size:13px;padding:40px">Rendering document…</div>';
  try{
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(arrayBuffer)}).promise;
    const numP=pdf.numPages;
    if(mode==='sy'){S.syPdf=pdf;S.syPages=numP;}else{S.stoPdf=pdf;S.stoPages=numP;}
    pagesEl.innerHTML='';
    for(let p=1;p<=numP;p++){
      const page=await pdf.getPage(p);
      const vp=page.getViewport({scale:1.5});
      const wrap=document.createElement('div');
      wrap.id=`${mode}-pw-${p}`;wrap.className='page-wrap';wrap.dataset.page=p;
      wrap.style.cssText=`width:${vp.width}px;height:${vp.height}px;`;
      const canvas=document.createElement('canvas');
      canvas.id=`${mode}-pc-${p}`;canvas.width=vp.width;canvas.height=vp.height;canvas.className='page-canvas';
      wrap.appendChild(canvas);
      const lbl=document.createElement('div');
      lbl.style.cssText='position:absolute;bottom:-20px;left:0;right:0;text-align:center;color:rgba(255,255,255,.5);font-size:11px;pointer-events:none';
      lbl.textContent=`Page ${p} of ${numP}`;
      wrap.appendChild(lbl);
      pagesEl.appendChild(wrap);
      const ctx=canvas.getContext('2d');
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      wrap.addEventListener('click',e=>{
        const placing=mode==='sy'?S.syPlacing:S.stoPlacing;
        if(!placing) return;
        const rect=wrap.getBoundingClientRect();
        const sx=vp.width/rect.width,sy=vp.height/rect.height;
        const x=(e.clientX-rect.left)*sx,y=(e.clientY-rect.top)*sy;
        const field={id:genId(),type:placing,page:p,x:x-80,y:y-16,w:placing==='signature'?170:placing==='initials'||placing==='name'?100:placing==='date'?130:140,h:placing==='signature'?44:32,value:null,recipientIdx:mode==='sto'?S.stoActiveRec:0,recipientId:mode==='sto'&&S.stoRecs[S.stoActiveRec]?null:null,required:true};
        if(mode==='sy'){S.syFields.push(field);S.syPlacing=null;}else{S.stoFields.push(field);S.stoPlacing=null;}
        document.querySelectorAll('.field-btn').forEach(b=>b.classList.remove('placing'));
        addFieldOverlay(field,wrap,mode);
        const hint=document.getElementById(`${mode}-hint`);
        if(hint) hint.innerHTML='Select a field type from the panel, then click the document.';
      });
      const fields=mode==='sy'?S.syFields:S.stoFields;
      fields.filter(f=>f.page===p).forEach(f=>addFieldOverlay(f,wrap,mode));
    }
  }catch(err){
    console.error('PDF render error:',err);
    pagesEl.innerHTML=`<div style="color:#FFD700;padding:20px;text-align:center">⚠ Could not render PDF.<br>Try uploading a different file.</div>`;
  }
}

function addFieldOverlay(field,wrap,mode){
  const existing=document.getElementById(`fd-${field.id}`);
  if(existing) existing.remove();
  const FC={signature:{c:'#2563EB'},initials:{c:'#7C3AED'},name:{c:'#0891B2'},date:{c:'#059669'},text:{c:'#D97706'}};
  const fc=FC[field.type]||{c:'#2563EB'};
  const rc=mode==='sto'?REC_COLORS[(field.recipientIdx||0)%REC_COLORS.length]:fc.c;
  const el=document.createElement('div');
  el.id=`fd-${field.id}`;el.className='sig-field';
  el.style.cssText=`left:${field.x}px;top:${field.y}px;width:${field.w}px;height:${field.h}px;border:2px dashed ${rc};background:${rc}18;color:${rc};font-family:Inter,sans-serif;z-index:10;`;
  const labels={signature:'✍ Sign',initials:'Initials',name:'Name',date:'📅 Date',text:'Text'};
  const recName=mode==='sto'&&S.stoRecs[field.recipientIdx]?` (${S.stoRecs[field.recipientIdx].name.split(' ')[0]})`:'';
  if(field.value){
    el.style.cssText+=`border-style:solid;border-color:#059669;background:rgba(5,150,105,.08);`;
    if(field.type==='signature'||field.type==='initials'){el.innerHTML=`<img src="${field.value}" style="max-width:100%;max-height:100%;object-fit:contain">`;}
    else{el.style.fontSize='12px';el.style.justifyContent='flex-start';el.style.padding='0 6px';el.textContent=field.value;}
  }else{el.style.fontSize='11px';el.innerHTML=`${labels[field.type]||field.type}${recName}`;}
  const del=document.createElement('div');del.className='fd-del';del.textContent='×';
  del.addEventListener('click',e=>{e.stopPropagation();if(mode==='sy')S.syFields=S.syFields.filter(f=>f.id!==field.id);else S.stoFields=S.stoFields.filter(f=>f.id!==field.id);el.remove();});
  el.appendChild(del);
  el.addEventListener('click',e=>{if(e.target===del)return;openFillModal(field,mode);});
  let drag=false,sx,sy,sl,st;
  el.addEventListener('mousedown',e=>{if(e.target===del)return;drag=true;sx=e.clientX;sy=e.clientY;sl=field.x;st=field.y;e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!drag)return;field.x=Math.max(0,sl+(e.clientX-sx));field.y=Math.max(0,st+(e.clientY-sy));el.style.left=field.x+'px';el.style.top=field.y+'px';});
  document.addEventListener('mouseup',()=>{drag=false;});
  wrap.appendChild(el);
}

function openFillModal(field,mode){
  const isDrawable=field.type==='signature'||field.type==='initials';
  const savedSig=S.profile?.saved_signature;
  showModal(`<div class="modal modal-md">
    <div class="modal-hd"><span class="modal-title">${field.type==='signature'?'Sign Here':field.type==='initials'?'Add Initials':field.type==='name'?'Full Name':field.type==='date'?'Set Date':'Enter Text'}</span>
    <button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
    ${isDrawable?`
      <div class="tabs" id="fill-tabs">
        <div class="tab active" data-ftab="draw">Draw</div>
        <div class="tab" data-ftab="type">Type</div>
        ${savedSig?'<div class="tab" data-ftab="saved">Saved</div>':''}
      </div>
      <div id="ftab-draw"><canvas id="draw-canvas" width="500" height="150" style="touch-action:none"></canvas>
        <div class="flex jcb aic mt2"><span class="text-sm text-mut">Draw ${field.type}</span><button class="btn btn-ghost btn-sm" id="clear-draw">Clear</button></div></div>
      <div id="ftab-type" class="hidden"><div class="fg"><label class="fl">Type your name</label>
        <input class="fi" id="type-sig" placeholder="${S.profile?.name||'Your name'}" style="font-family:'Dancing Script',cursive;font-size:26px;height:64px"></div>
        <p class="fhint">Rendered in cursive</p></div>
      ${savedSig?`<div id="ftab-saved" class="hidden"><div style="border:1px solid var(--bdr);border-radius:8px;padding:20px;text-align:center"><img src="${savedSig}" style="max-height:80px;object-fit:contain"></div><p class="fhint mt2">Your saved signature</p></div>`:''}`:''}
    ${field.type==='date'?`<div class="fg"><label class="fl">Date</label><input type="date" class="fi" id="fill-date" value="${new Date().toISOString().slice(0,10)}"></div>`:''}
    ${field.type==='name'?`<div class="fg"><label class="fl">Full Name</label><input class="fi" id="fill-name" value="${esc(S.profile?.name||'')}"></div>`:''}
    ${field.type==='text'?`<div class="fg"><label class="fl">Text</label><input class="fi" id="fill-text" placeholder="Enter text…" value="${field.value||''}"></div>`:''}
    </div>
    <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="fill-confirm">Apply</button></div>
  </div>`);

  if(isDrawable){
    const canvas=document.getElementById('draw-canvas');
    const ctx=canvas.getContext('2d');
    ctx.strokeStyle='#0F172A';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
    let drawing=false,lx,ly;
    const pos=e=>{const r=canvas.getBoundingClientRect();return[(e.touches?e.touches[0].clientX:e.clientX-r.left)*(canvas.width/r.width),(e.touches?e.touches[0].clientY:e.clientY-r.top)*(canvas.height/r.height)];};
    canvas.addEventListener('mousedown',e=>{drawing=true;[lx,ly]=pos(e);ctx.beginPath();ctx.arc(lx,ly,1,0,Math.PI*2);ctx.fill();});
    canvas.addEventListener('mousemove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];});
    canvas.addEventListener('mouseup',()=>drawing=false); canvas.addEventListener('mouseleave',()=>drawing=false);
    canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;[lx,ly]=pos(e);},{passive:false});
    canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];},{passive:false});
    canvas.addEventListener('touchend',()=>drawing=false);
    document.getElementById('clear-draw').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
    let activeTab='draw';
    document.querySelectorAll('#fill-tabs .tab').forEach(t=>t.addEventListener('click',()=>{
      document.querySelectorAll('#fill-tabs .tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
      activeTab=t.dataset.ftab;
      ['draw','type','saved'].forEach(tb=>{const el=document.getElementById(`ftab-${tb}`);if(el)el.classList.toggle('hidden',activeTab!==tb);});
    }));
    document.getElementById('fill-confirm').onclick=async()=>{
      let val;
      if(activeTab==='draw'){
        const id=ctx.getImageData(0,0,canvas.width,canvas.height);
        if(!id.data.some((v,i)=>i%4===3&&v>10)){toast('Draw your '+field.type,'err');return;}
        val=canvas.toDataURL();
      }else if(activeTab==='type'){
        const txt=(document.getElementById('type-sig').value||'').trim();
        if(!txt){toast('Enter text','err');return;}
        const oc=document.createElement('canvas');oc.width=field.w*2;oc.height=field.h*2;
        const oc2=oc.getContext('2d');oc2.font=`${field.h*1.1}px "Dancing Script",cursive`;oc2.fillStyle='#0F172A';oc2.textBaseline='middle';oc2.fillText(txt,4,field.h);val=oc.toDataURL();
      }else{ val=S.profile?.saved_signature; }
      if(!val) return;
      field.value=val;
      const wrap=document.getElementById(`${mode}-pw-${field.page}`);
      if(wrap) addFieldOverlay(field,wrap,mode);
      // Auto-save signature to profile if it's a signature field
      if(field.type==='signature'&&activeTab==='draw'&&S.user&&!S.profile?.saved_signature){
        const save=confirm('Save this signature for future use?');
        if(save){ await SB.from('profiles').update({saved_signature:val}).eq('id',S.user.id); if(S.profile) S.profile.saved_signature=val; }
      }
      hideModal();
    };
  }else if(field.type==='date'){
    document.getElementById('fill-confirm').onclick=()=>{
      const v=document.getElementById('fill-date').value;
      if(!v){toast('Pick a date','err');return;}
      field.value=new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const wrap=document.getElementById(`${mode}-pw-${field.page}`);if(wrap)addFieldOverlay(field,wrap,mode);hideModal();
    };
  }else if(field.type==='name'){
    document.getElementById('fill-confirm').onclick=()=>{
      const v=(document.getElementById('fill-name').value||'').trim();
      if(!v){toast('Enter name','err');return;}
      field.value=v;const wrap=document.getElementById(`${mode}-pw-${field.page}`);if(wrap)addFieldOverlay(field,wrap,mode);hideModal();
    };
  }else{
    document.getElementById('fill-confirm').onclick=()=>{
      const v=(document.getElementById('fill-text').value||'').trim();
      if(!v){toast('Enter text','err');return;}
      field.value=v;const wrap=document.getElementById(`${mode}-pw-${field.page}`);if(wrap)addFieldOverlay(field,wrap,mode);hideModal();
    };
  }
}

// =====================================================
// FILE UPLOAD TO SUPABASE STORAGE
// =====================================================
function setupUploadZone(dropId,inputId,mode){
  const drop=document.getElementById(dropId),input=document.getElementById(inputId);
  if(!drop||!input) return;
  drop.addEventListener('click',()=>input.click());
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0],mode);});
  input.addEventListener('change',()=>{if(input.files[0])handleFile(input.files[0],mode);});
}

async function handleFile(file, mode){
  if(file.size>26*1024*1024){toast('File exceeds 25 MB','err');return;}
  showLoading('Uploading to Supabase…');
  try{
    const ext=file.name.split('.').pop().toLowerCase();
    const path=`${S.user.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const{error:upErr}=await SB.storage.from('documents').upload(path,file,{contentType:file.type||'application/pdf',upsert:false});
    if(upErr) throw upErr;
    // Read ArrayBuffer for PDF rendering
    const ab=await file.arrayBuffer();
    PDF_CACHE[mode]=ab;
    if(mode==='sy'){S.syFile=true;S.syName=file.name;S.syFilePath=path;}
    else{S.stoFile=true;S.stoName=file.name;S.stoFilePath=path;}
    hideLoading();toast('Uploaded successfully!','success');render();
  }catch(e){
    hideLoading();
    // Fallback: use in-memory only (if storage bucket not configured)
    const ab=await file.arrayBuffer();
    PDF_CACHE[mode]=ab;
    if(mode==='sy'){S.syFile=true;S.syName=file.name;S.syFilePath=null;}
    else{S.stoFile=true;S.stoName=file.name;S.stoFilePath=null;}
    toast('Loaded locally (storage not configured)','info');
    render();
  }
}

async function downloadSignedPDF(mode){
  const fields=mode==='sy'?S.syFields:S.stoFields;
  const name=(mode==='sy'?S.syName:S.stoName).replace(/\.[^.]+$/,'');
  if(!PDF_CACHE[mode]){toast('Document not found — re-upload','err');return;}
  const{jsPDF}=window.jspdf;
  showModal(`<div class="modal modal-sm"><div class="modal-bd" style="text-align:center;padding:40px">
    <div style="font-size:40px;margin-bottom:16px">⏳</div>
    <h3 class="fw7 mb2">Generating Signed PDF…</h3>
    <p class="text-sm text-mut" id="pdf-prog">Rendering pages…</p>
  </div></div>`);
  try{
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(PDF_CACHE[mode])}).promise;
    const numP=pdf.numPages;
    const doc=new jsPDF({orientation:'portrait',unit:'pt'});
    const SF=2.0/1.5;
    let first=true;
    for(let p=1;p<=numP;p++){
      const prog=document.getElementById('pdf-prog');
      if(prog) prog.textContent=`Rendering page ${p} of ${numP}…`;
      const page=await pdf.getPage(p);
      const vp=page.getViewport({scale:2.0});
      const offC=document.createElement('canvas');offC.width=vp.width;offC.height=vp.height;
      const ctx=offC.getContext('2d');
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      for(const f of fields.filter(fi=>fi.page===p&&fi.value)){
        const fx=f.x*SF,fy=f.y*SF,fw=f.w*SF,fh=f.h*SF;
        if(f.type==='signature'||f.type==='initials'){
          const img=new Image();img.src=f.value;
          await new Promise(r=>{img.onload=r;img.onerror=()=>r();});
          ctx.drawImage(img,fx,fy,fw,fh);
        }else{
          ctx.font=`600 ${Math.round(fh*0.5)}px Inter,sans-serif`;ctx.fillStyle='#0F172A';ctx.textBaseline='middle';
          ctx.fillText(f.value||'',fx+6,fy+fh/2);
        }
      }
      // Audit stamp
      const refId=genId().toUpperCase();
      ctx.font='18px Inter,sans-serif';ctx.fillStyle='rgba(100,116,139,.4)';
      ctx.fillText(`Signed via SignSoft · ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} · Ref: ${refId}`,14,offC.height-14);
      const imgData=offC.toDataURL('image/png',.92);
      const pw=595.28;const ph=pw*(offC.height/offC.width);
      if(!first)doc.addPage([pw,ph],'p');first=false;
      doc.addImage(imgData,'PNG',0,0,pw,ph);
    }
    doc.save(`${name}_signed.pdf`);
    hideModal();toast(`✓ "${name}_signed.pdf" downloaded!`,'success');
    // Save record to Supabase
    const{data:newDoc,error}=await SB.from('documents').insert({
      name:`${name}_signed.pdf`,type:'pdf',status:'signed',uploaded_by:S.user.id,
      file_path:S.syFilePath||null,pages:numP,category:'Signed',
      signing_fields:JSON.stringify(fields)
    }).select().single();
    if(!error&&newDoc){
      await logAudit(newDoc.id,`Document signed and downloaded (${fields.filter(f=>f.value).length} fields)`);
    }
    setTimeout(()=>nav('documents'),1800);
  }catch(e){ hideModal(); console.error(e); toast('PDF generation error: '+e.message,'err'); }
}

// SEND DOCUMENT TO OTHERS
// =====================================================
async function sendDocumentToOthers(){
  if(S.stoRecs.length===0){toast('Add at least one recipient','err');return;}
  if(!S.stoRecs.every(r=>r.name&&r.email)){toast('Fill all recipient details','err');return;}
  showLoading('Creating signing request…');
  try{
    // Create document record
    const{data:doc,error:de}=await SB.from('documents').insert({
      name:S.stoName,type:'pdf',status:'pending',uploaded_by:S.user.id,
      file_path:S.stoFilePath||null,pages:S.stoPages||1,category:'Sent',
      signing_order:S.stoOrder||'sequential',
      envelope_msg:S.stoMsg||null,envelope_subj:S.stoSubj||null,
      expires_at:S.stoDeadline?new Date(S.stoDeadline).toISOString():null,
      signing_fields:JSON.stringify(S.stoFields)
    }).select().single();
    if(de) throw de;
    // Create recipients
    const recInserts=S.stoRecs.map((r,i)=>({
      document_id:doc.id,name:r.name,email:r.email,role:r.role||'signer',
      verify_method:r.verify||'otp',order_index:i,recipient_idx:i,
      color:REC_COLORS[i%REC_COLORS.length],
      user_id:S.users?.find(u=>u.email===r.email)?.id||null
    }));
    const{data:recs,error:re}=await SB.from('signing_recipients').insert(recInserts).select();
    if(re) throw re;
    await logAudit(doc.id,`Document sent for signing (${S.stoRecs.length} recipients)`);
    // Send invitation emails
    let emailsSent=0, otpsShown=[];
    for(const rec of recs){
      if(rec.role==='cc'){
        // CC: just notify
        await sendEmail(rec.email,`You were CC'd on: ${S.stoName}`,`<p>You were copied on a signing request for <b>${esc(S.stoName)}</b>.</p>`,`info`);
      }else{
        const result=await sendSigningInvitation(rec.id,rec.name,rec.email,S.stoName,rec.signing_token,S.stoMsg||'');
        if(result?.success) emailsSent++;
        else otpsShown.push({name:rec.name,email:rec.email,token:rec.signing_token});
      }
      await createNotification(S.user.id,`Invitation sent to ${rec.name}`,`Signing request for "${S.stoName}" has been sent.`,'info',doc.id);
    }
    hideLoading();
    showModal(`<div class="modal modal-lg">
      <div class="modal-hd"><span class="modal-title">✅ Document Sent!</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
      <div class="modal-bd">
        ${emailsSent>0?`<div style="padding:12px;background:var(--ok-l);border-radius:8px;margin-bottom:16px">✅ ${emailsSent} invitation email${emailsSent>1?'s':''} sent via Resend.</div>`:''}
        ${otpsShown.length>0?`<p class="text-sm text-mut mb3">Email not configured — here are the signing links to share manually:</p>`:''}
        ${recs.filter(r=>r.role!=='cc').map((r,i)=>`
        <div style="padding:14px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:10px">
          <div class="flex jcb aic mb2"><b>${esc(r.name)}</b><span class="text-sm text-mut">${esc(r.email)}</span></div>
          <div style="background:var(--bg);border-radius:6px;padding:10px;font-size:11.5px;word-break:break-all;color:var(--mut);margin-bottom:8px">
            ${window.location.href.split('?')[0]}?token=${r.signing_token}
          </div>
          <button class="btn btn-secondary btn-sm w100" onclick="navigator.clipboard.writeText('${window.location.href.split('?')[0]}?token=${r.signing_token}');this.textContent='Copied!'">Copy Link</button>
        </div>`).join('')}
      </div>
      <div class="modal-ft"><button class="btn btn-primary" data-action="goto-docs">View Documents</button></div>
    </div>`);
  }catch(e){ hideLoading(); toast('Error: '+e.message,'err'); console.error(e); }
}

async function setupMFA(){

  try{
    const{data:{totp:{qr_code,secret,uri}},error}=await SB.auth.mfa.enroll({factorType:'totp',friendlyName:'SignSoft Authenticator'});
    if(error) throw error;
    hideLoading();
    showModal(`<div class="modal modal-sm">
      <div class="modal-hd"><span class="modal-title">Set Up Authenticator App</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
      <div class="modal-bd">
        <p class="text-sm text-mut mb4">Scan this QR code with Google Authenticator, Authy, or any TOTP app.</p>
        <div style="text-align:center;margin-bottom:16px"><img src="${qr_code}" style="width:180px;height:180px;border:4px solid white;border-radius:8px"></div>
        <div style="font-size:12px;color:var(--mut);text-align:center;margin-bottom:16px">Or enter manually: <code style="background:var(--bg);padding:2px 6px;border-radius:4px">${secret}</code></div>
        <div class="fg"><label class="fl">Enter the 6-digit code to confirm</label><input class="fi" id="totp-confirm" maxlength="6" placeholder="000000" style="text-align:center;font-size:22px;letter-spacing:6px"></div>
      </div>
      <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="totp-verify-btn">Verify & Enable</button></div>
    </div>`);
    document.getElementById('totp-verify-btn').onclick=async()=>{
      const code=document.getElementById('totp-confirm').value.trim();
      const{data:{session},error}=await SB.auth.mfa.challengeAndVerify({factorId:totp.id||'',code});

      if(S.profile) S.profile.mfa_enabled=true;
      hideModal();toast('MFA enabled!','success');render();
    };
  }catch(e){ hideLoading(); toast(e.message,'err'); }
}

function bindAppEvents(){
  const app=document.getElementById('app');
  app.addEventListener('click',handleAppClick);
  app.addEventListener('change',handleAppChange);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(S.syPlacing){S.syPlacing=null;document.querySelectorAll('.field-btn').forEach(b=>b.classList.remove('placing'));const h=document.getElementById('sy-hint');if(h)h.innerHTML='Select a field type.';}
      if(S.stoPlacing){S.stoPlacing=null;document.querySelectorAll('.field-btn').forEach(b=>b.classList.remove('placing'));const h=document.getElementById('sto-hint');if(h)h.innerHTML='Select a field type.';}
    }
  });
  if(S.page==='sign-yourself'){
    if(S.syStep===1) setupUploadZone('sy-drop','sy-file','sy');
    if(S.syStep===2&&PDF_CACHE['sy']) setTimeout(()=>renderPDFPages(PDF_CACHE['sy'],'sy'),100);
    if(S.syStep===3){
      const dlBtn=document.getElementById('sy-dl-btn');
      if(dlBtn) dlBtn.onclick=()=>downloadSignedPDF('sy');
    }
  }
  if(S.page==='send-to-others'){
    if(S.stoStep===1) setupUploadZone('sto-drop','sto-file','sto');
    if(S.stoStep===3&&PDF_CACHE['sto']) setTimeout(()=>renderPDFPages(PDF_CACHE['sto'],'sto'),100);
  }
  const ds=document.getElementById('doc-search');
  if(ds) ds.addEventListener('input',e=>{S.docSearch=e.target.value;render();});
}

function handleAppClick(e){
  const nav_el=e.target.closest('[data-nav]');
  if(nav_el){nav(nav_el.dataset.nav);return;}
  const action_el=e.target.closest('[data-action]');
  if(action_el){handleAction(action_el.dataset.action,action_el);return;}
  const place_el=e.target.closest('[data-place]');
  if(place_el){
    const mode=place_el.dataset.mode,type=place_el.dataset.place;
    if(mode==='sy'){S.syPlacing=S.syPlacing===type?null:type;}else{S.stoPlacing=S.stoPlacing===type?null:type;}
    document.querySelectorAll('.field-btn').forEach(b=>b.classList.remove('placing'));
    if((mode==='sy'&&S.syPlacing)||(mode==='sto'&&S.stoPlacing)) place_el.classList.add('placing');
    const hint=document.getElementById(`${mode}-hint`);
    const placing=mode==='sy'?S.syPlacing:S.stoPlacing;
    if(hint) hint.innerHTML=placing?`<b style="color:#60A5FA">Placing: ${placing}</b> — click document · ESC to cancel`:'Select a field type.';
    return;
  }
  const rec_el=e.target.closest('[data-rec]');
  if(rec_el&&rec_el.dataset.rec!==undefined){S.stoActiveRec=parseInt(rec_el.dataset.rec);document.querySelectorAll('[data-rec]').forEach(b=>b.classList.remove('placing'));rec_el.classList.add('placing');return;}
  const atab=e.target.closest('[data-atab]');
  if(atab){S.adminTab=atab.dataset.atab;render();return;}
  const stab=e.target.closest('[data-stab]');
  if(stab){S.settingsTab=stab.dataset.stab;render();return;}
  const filt=e.target.closest('[data-filter]');
  if(filt){S.docFilter=filt.dataset.filter;render();return;}
  // Close notif panel if clicking outside
  if(S.notifOpen&&!e.target.closest('#notif-bell')&&!e.target.closest('.notif-panel')){S.notifOpen=false;render();return;}
}

function handleAppChange(e){
  const rf=e.target.closest('[data-rec-field]');
  if(rf){const i=parseInt(rf.dataset.recI);const f=rf.dataset.recField;if(S.stoRecs[i])S.stoRecs[i][f]=rf.value;}
  const so=e.target.closest('[name="sig-order"]');
  if(so)S.stoOrder=so.value;
}

async function handleAction(action,el){
  switch(action){
    case'logout':
      stopCamera();
      await SB.auth.signOut();S.user=null;S.profile=null;if(notifChannel){SB.removeChannel(notifChannel);notifChannel=null;}
      render();break;
    case'close-modal':hideModal();stopCamera();break;
    case'goto-docs':hideModal();nav('documents');break;
    case'toggle-notif':S.notifOpen=!S.notifOpen;render();break;
    case'mark-all-read':
      await SB.from('notifications').update({read:true}).eq('user_id',S.user.id);
      S.unreadCount=0;S.notifOpen=false;render();break;
    case'read-notif':
      await SB.from('notifications').update({read:true}).eq('id',el.dataset.id);
      S.unreadCount=Math.max(0,S.unreadCount-1);updateNotifBell();break;
    case'export-audit':{
      const{data:rows=[]}=await SB.from('audit_log').select('*').order('created_at',{ascending:false}).limit(1000);
      const csv=['Time,Action,Actor,IP,Device'].concat(rows.map(r=>`"${r.created_at}","${r.action}","${r.actor_name}","${r.ip_address}","${(r.device||'').replace(/"/g,'""')}"`)).join('\n');
      const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='audit_log.csv';a.click();break;}
    case'sy-next':
      if(S.syStep===1&&!S.syFile){toast('Upload a document first','err');return;}
      S.syStep++;render();break;
    case'sy-back':S.syStep=Math.max(1,S.syStep-1);render();break;
    case'sto-next':
      if(S.stoStep===1&&!S.stoFile){toast('Upload a document first','err');return;}
      if(S.stoStep===2){
        S.stoSubj=document.getElementById('sto-subj')?.value||'';
        S.stoMsg=document.getElementById('sto-msg')?.value||'';
        S.stoDeadline=document.getElementById('sto-deadline')?.value||'';
        if(S.stoRecs.length===0){toast('Add at least one recipient','err');return;}
      }
      S.stoStep++;render();break;
    case'sto-back':S.stoStep=Math.max(1,S.stoStep-1);render();break;
    case'sto-send':await sendDocumentToOthers();break;
    case'add-rec':S.stoRecs.push({name:'',email:'',role:'signer',verify:'otp'});render();break;
    case'del-rec':{const i=parseInt(el.dataset.i);S.stoRecs.splice(i,1);render();break;}
    case'sign-doc':await quickSignDoc(el.dataset.id);break;
    case'view-audit':S.auditDocId=el.dataset.id;nav('audit');break;
    case'del-doc':{
      if(!confirm('Delete this document?')) return;
      await SB.from('documents').update({status:'deleted',deleted_at:new Date().toISOString()}).eq('id',el.dataset.id);
      await logAudit(el.dataset.id,'Document deleted');
      toast('Document deleted','success');render();break;}
    case'void-doc':{
      if(!confirm('Void this document? All recipients will be notified.')) return;
      await SB.from('documents').update({status:'voided',voided_at:new Date().toISOString(),voided_by:S.user.id}).eq('id',el.dataset.id);
      await logAudit(el.dataset.id,'Document voided');
      toast('Document voided','success');render();break;}
    case'send-reminder':{
      const doc=S.docs.find(d=>d.id===el.dataset.id);
      if(!doc) break;
      const pending=(doc.signing_recipients||[]).filter(r=>r.status==='pending');
      for(const r of pending){
        await sendEmail(r.email,`Reminder: Please sign "${doc.name}"`,`<p>Hi <b>${esc(r.name)}</b>,</p><p>This is a reminder to sign <b>${esc(doc.name)}</b>.</p>${doc.expires_at?`<p>Deadline: <b>${fmtDT(doc.expires_at)}</b></p>`:''}`,`warning`);
      }
      toast(`Reminder sent to ${pending.length} recipient${pending.length!==1?'s':''}!`,'success');break;}
    case'view-links':showLinksModal(el.dataset.id);break;
    case'audit-sel':S.auditDocId=el.dataset.id||null;render();break;
    case'save-profile':{
      const n=(document.getElementById('set-name').value||'').trim();
      const d=(document.getElementById('set-dept').value||'').trim();
      if(!n){toast('Name required','err');return;}
      await SB.from('profiles').update({name:n,dept:d}).eq('id',S.user.id);
      if(S.profile){S.profile.name=n;S.profile.dept=d;}
      toast('Profile updated','success');render();break;}
    case'change-pw':{
      const nw=(document.getElementById('pw-new').value||'');
      const cf=(document.getElementById('pw-conf').value||'');
      if(nw.length<6){toast('Min 6 characters','err');return;}
      if(nw!==cf){toast('Passwords do not match','err');return;}
      const{error}=await SB.auth.updateUser({password:nw});
      if(error){toast(error.message,'err');return;}
      toast('Password updated','success');break;}
    case'enable-mfa':await setupMFA();break;
    case'disable-mfa':{
      const{data:{totp:factors}}=await SB.auth.mfa.listFactors();
      if(factors?.length>0){ await SB.auth.mfa.unenroll({factorId:factors[0].id}); }
      await SB.from('profiles').update({mfa_enabled:false}).eq('id',S.user.id);
      if(S.profile) S.profile.mfa_enabled=false;
      toast('MFA disabled','success');render();break;}
    case'save-notif':{
      const prefs={};
      document.querySelectorAll('.notif-pref').forEach(cb=>{prefs[cb.dataset.key]=cb.checked;});
      await SB.from('profiles').update({notif_prefs:prefs}).eq('id',S.user.id);
      if(S.profile) S.profile.notif_prefs=prefs;
      toast('Notification preferences saved','success');break;}
    case'update-saved-sig':showSaveSignatureModal();break;
    case'clear-saved-sig':{
      await SB.from('profiles').update({saved_signature:null}).eq('id',S.user.id);
      if(S.profile) S.profile.saved_signature=null;
      toast('Signature cleared','success');render();break;}
    case'invite-user':showInviteModal();break;
    case'edit-user':showEditUserModal(el.dataset.id);break;
    case'save-org':toast('Organisation settings saved (demo)','success');break;
    case'save-security':toast('Security settings saved (demo)','success');break;
    case'add-delegate':showAddDelegateModal();break;
    case'revoke-del':{
      await SB.from('delegations').update({status:'revoked'}).eq('id',el.dataset.id);
      await logAudit(null,'Delegation revoked');
      toast('Delegation revoked','success');nav('delegate');break;}
    case'approve-del':{
      await SB.from('delegations').update({status:'active',approved_by:S.user.id,approved_at:new Date().toISOString()}).eq('id',el.dataset.id);
      toast('Delegation approved!','success');nav('delegate');break;}
    case'reject-del':{
      await SB.from('delegations').update({status:'revoked'}).eq('id',el.dataset.id);
      toast('Delegation rejected','success');nav('delegate');break;}
  }
}

// QUICK SIGN (from dashboard)
// =====================================================
async function quickSignDoc(docId){
  const doc=S.docs.find(d=>d.id===docId);if(!doc) return;
  showModal(`<div class="modal modal-sm">
    <div class="modal-hd"><span class="modal-title">Sign: ${esc(doc.name)}</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
      <p class="text-sm text-mut mb4">By clicking Sign, you confirm your identity and agree to the document.</p>
      <div class="fg"><label class="fl">Draw Your Signature</label>
        <canvas id="quick-sig" width="380" height="120" style="border:1px solid var(--bdr);border-radius:6px;background:#fff;cursor:crosshair;display:block;width:100%;touch-action:none"></canvas>
        <button class="btn btn-ghost btn-sm mt2" id="qs-clear">Clear</button></div>
    </div>
    <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button>
    <button class="btn btn-success" id="qs-sign">✓ Sign Document</button></div>
  </div>`);
  const qc=document.getElementById('quick-sig');
  const qCtx=qc.getContext('2d');qCtx.strokeStyle='#0F172A';qCtx.lineWidth=2.5;qCtx.lineCap='round';
  let qd=false,qlx,qly;
  const qp=e=>{const r=qc.getBoundingClientRect();return[(e.clientX-r.left)*(qc.width/r.width),(e.clientY-r.top)*(qc.height/r.height)];};
  qc.addEventListener('mousedown',e=>{qd=true;[qlx,qly]=qp(e);});
  qc.addEventListener('mousemove',e=>{if(!qd)return;const[x,y]=qp(e);qCtx.beginPath();qCtx.moveTo(qlx,qly);qCtx.lineTo(x,y);qCtx.stroke();[qlx,qly]=[x,y];});
  qc.addEventListener('mouseup',()=>qd=false);
  document.getElementById('qs-clear').onclick=()=>qCtx.clearRect(0,0,qc.width,qc.height);
  document.getElementById('qs-sign').onclick=async()=>{
    const id=qCtx.getImageData(0,0,qc.width,qc.height);
    if(!id.data.some((v,i)=>i%4===3&&v>10)){toast('Draw signature first','err');return;}
    showLoading('Signing…');
    const sigData=qc.toDataURL();
    // Update recipient status
    await SB.from('signing_recipients').update({status:'signed',signed_at:new Date().toISOString()}).eq('document_id',docId).eq('user_id',S.user.id);
    await logAudit(docId,`Signed by ${S.profile?.name||S.user.email}`);
    // Check if all signed
    const{data:recs=[]}=await SB.from('signing_recipients').select('status,role').eq('document_id',docId);
    const allDone=recs.filter(r=>r.role==='signer').every(r=>r.status==='signed');
    if(allDone){
      await SB.from('documents').update({status:'completed',updated_at:new Date().toISOString()}).eq('id',docId);
      await logAudit(docId,'All parties signed — document completed');
      const uploader=S.docs.find(d=>d.id===docId)?.uploaded_by;
      if(uploader&&uploader!==S.user.id){
        const{data:up}=await SB.from('profiles').select('name,email').eq('id',uploader).single();
        if(up) await sendCompletionEmail(up.email,up.name,doc.name,recs.filter(r=>r.role==='signer').length);
      }
    }else{
      await SB.from('documents').update({updated_at:new Date().toISOString()}).eq('id',docId);
    }
    hideLoading();hideModal();toast('✓ Document signed!','success');render();
  };
}

    <div class="modal-hd"><span class="modal-title">Signing Links — ${esc(doc.name)}</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
      ${recs.map(r=>`<div style="padding:14px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:10px">
        <div class="flex jcb aic mb2">${avatar(r.name,26,r.id)}<b style="flex:1;margin-left:8px">${esc(r.name)}</b>${statusBadge(r.status)}</div>
        <div class="text-sm text-mut mb2">${esc(r.email)} · ${r.verify_method==='otp_ocr'?'OTP + Face ID':r.verify_method==='otp'?'Email OTP':'No verification'}</div>
        ${r.status==='pending'?`<div style="background:var(--bg);border-radius:6px;padding:8px;font-size:11px;word-break:break-all;margin-bottom:8px">${window.location.href.split('?')[0]}?token=${r.signing_token}</div>
        <button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${window.location.href.split('?')[0]}?token=${r.signing_token}');this.textContent='Copied!'">Copy Link</button>`
        :`<div style="color:var(--ok);font-size:13px">${IC.check} Signed on ${fmtDT(r.signed_at)}</div>`}
      </div>`).join('')}
    </div>
    <div class="modal-ft"><button class="btn btn-primary" data-action="close-modal">Close</button></div>
  </div>`);
}

function showInviteModal(){
  showModal(`<div class="modal modal-sm">
    <div class="modal-hd"><span class="modal-title">Invite User</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
      <div class="fg"><label class="fl">Full Name</label><input class="fi" id="inv-name" placeholder="Jane Smith"></div>
      <div class="fg"><label class="fl">Email</label><input class="fi" type="email" id="inv-email" placeholder="jane@company.com"></div>
      <div class="fg"><label class="fl">Department</label><input class="fi" id="inv-dept" placeholder="Legal"></div>
      <div class="fg"><label class="fl">Role</label><select class="fi" id="inv-role">
        ${['user','manager','org_admin','read_only'].map(r=>`<option value="${r}">${r.replace('_',' ')}</option>`).join('')}
      </select></div>
      <p class="fhint">An invitation email will be sent. The user sets their own password.</p>
    </div>
    <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="inv-save">Send Invitation</button></div>
  </div>`);
  document.getElementById('inv-save').onclick=async()=>{
    const name=(document.getElementById('inv-name').value||'').trim();
    const email=(document.getElementById('inv-email').value||'').trim();
    const dept=(document.getElementById('inv-dept').value||'').trim();
    const role=document.getElementById('inv-role').value;
    if(!name||!email){toast('Name and email required','err');return;}
    showLoading('Sending invitation…');
    try{
      const{data,error}=await SB.auth.admin.inviteUserByEmail(email,{data:{name,dept,role}});
      if(error) throw error;
      hideLoading();hideModal();toast(`Invitation sent to ${name}!`,'success');
    }catch(e){
      hideLoading();
      // Fallback: signUp without email confirmation
      try{
        const tempPw='Welcome@123!';
        const{error:e2}=await SB.auth.signUp({email,password:tempPw,options:{data:{name,dept,role}}});
        if(e2) throw e2;
        hideLoading();hideModal();toast(`User ${name} created (temp password: Welcome@123!)','success');render();
      }catch(e3){ hideLoading(); toast('Error: '+e3.message,'err'); }
    }
  };
}

function showEditUserModal(uid){
  const u=S.allUsers?.find(x=>x.id===uid);if(!u) return;
  showModal(`<div class="modal modal-sm">
    <div class="modal-hd"><span class="modal-title">Edit User</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
      <div class="fg"><label class="fl">Name</label><input class="fi" id="eu-name" value="${esc(u.name)}"></div>
      <div class="fg"><label class="fl">Department</label><input class="fi" id="eu-dept" value="${esc(u.dept||'')}"></div>
      <div class="fg"><label class="fl">Role</label><select class="fi" id="eu-role">${['user','manager','org_admin','read_only','super_admin'].map(r=>`<option value="${r}"${u.role===r?' selected':''}>${r.replace('_',' ')}</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">Status</label><select class="fi" id="eu-status">${['active','inactive','suspended'].map(r=>`<option value="${r}"${u.status===r?' selected':''}>${r}</option>`).join('')}</select></div>
    </div>
    <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="eu-save">Save</button></div>
  </div>`);
  document.getElementById('eu-save').onclick=async()=>{
    const n=document.getElementById('eu-name').value.trim();
    const dept=document.getElementById('eu-dept').value.trim();
    const role=document.getElementById('eu-role').value;
    const status=document.getElementById('eu-status').value;
    const{error}=await SB.from('profiles').update({name:n,dept,role,status}).eq('id',uid);
    if(error){toast(error.message,'err');return;}
    hideModal();toast('User updated','success');render();
  };
}

function showSaveSignatureModal(){
  showModal(`<div class="modal modal-md">
    <div class="modal-hd"><span class="modal-title">Draw & Save Signature</span><button class="btn btn-ghost btn-sm" data-action="close-modal">${IC.x}</button></div>
    <div class="modal-bd">
      <p class="text-sm text-mut mb3">This signature will be available for quick use on all documents.</p>
      <canvas id="draw-canvas" width="500" height="150" style="touch-action:none"></canvas>
      <button class="btn btn-ghost btn-sm mt2" id="clear-draw">Clear</button>
    </div>
    <div class="modal-ft"><button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" id="save-sig-btn">Save Signature</button></div>
  </div>`);
  const canvas=document.getElementById('draw-canvas');
  const ctx=canvas.getContext('2d');ctx.strokeStyle='#0F172A';ctx.lineWidth=2.5;ctx.lineCap='round';
  let drawing=false,lx,ly;
  const pos=e=>{const r=canvas.getBoundingClientRect();return[(e.touches?e.touches[0].clientX:e.clientX-r.left)*(canvas.width/r.width),(e.touches?e.touches[0].clientY:e.clientY-r.top)*(canvas.height/r.height)];};
  canvas.addEventListener('mousedown',e=>{drawing=true;[lx,ly]=pos(e);});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];});
  canvas.addEventListener('mouseup',()=>drawing=false);
  document.getElementById('clear-draw').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('save-sig-btn').onclick=async()=>{
    const id=ctx.getImageData(0,0,canvas.width,canvas.height);
    if(!id.data.some((v,i)=>i%4===3&&v>10)){toast('Draw your signature first','err');return;}
    const val=canvas.toDataURL();
    await SB.from('profiles').update({saved_signature:val}).eq('id',S.user.id);
    if(S.profile) S.profile.saved_signature=val;
    hideModal();toast('Signature saved!','success');render();
  };
}
